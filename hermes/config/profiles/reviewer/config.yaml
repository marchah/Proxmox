model:
  default: thinkingcap-27b
  provider: custom
  base_url: http://gpu2:8080/v1
  api_key: ''
  context_length: 65536   # Hermes requires >=64K. NOTE: no longer "matches the served ctx" —
                          # thinkingcap-27b serves 217,088 under CTX=auto, so this is a
                          # deliberate floor, not a mirror of the server.
# Reviewer = ThinkingCap-Qwen3.6-27B (reinstated 2026-08-14). This REVERSES the previous rationale,
# which chose a non-thinking reviewer specifically to prevent the runaway that ThinkingCap was blamed
# for. That blame was confounded: the runaway happened inside a loop with NO coding harness and an
# uncapped output, and ThinkingCap's own headline result is that thinking-trace truncation falls
# 2.9% -> 0.4% with 5 seeds and 95% CIs. Reasoning is now an ASSET for review, and it is bounded two
# ways: --n-predict 32768 on the server, and --reasoning-format auto so thought tokens land in
# reasoning_content instead of leaking into content.
timezone: America/New_York
onboarding:
  seen:
    tool_progress_prompt: true
# Trimmed toolset for the reviewer: review = read a diff + run checks (terminal) + verdict (kanban) +
# skills; no browser/computer_use/image_gen/web/etc. so it can't wander off-script and drop the
# kanban_complete call.
platform_toolsets:
  cli:
    - terminal
    - kanban
    - skills
    - file
    - todo
