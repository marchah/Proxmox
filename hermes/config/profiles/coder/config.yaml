model:
  # qwen3.8-27b-dflash2 — the SAME Qwen3.8-27B weights throughout this entry's history;
  # only the speculative drafter has changed. Lineage: borrowed Qwen3.6 DFlash head ->
  # Qwen3.8's own MTP head (2026-08-15) -> its own DFlash2 head (2026-08-28).
  #
  # DFlash2 landed upstream in llama.cpp #27342 and ships in the pinned b10678. Measured on
  # CT 123 2026-08-28, 3 reps, 3 prompts, temp 0, identical request params, against an
  # explicit NO-SPECULATION control (17.03 tok/s):
  #              code    prose   list    overall
  #   mtp  n=2   35.44   29.19   31.72   32.12    (previous coder)
  #   dfl2 n=8   67.14   26.72   30.47   41.44    +29% overall, +89% on code
  # Code is what the coder actually emits, so the prose/list losses (-8.5% / -3.9%) are an
  # acceptable trade. The DFlash2 drafter is also SMALLER: 1.92 GiB vs the MTP head's 4.19 GiB.
  #
  # ⚠️ n-max 8 does NOT contradict the documented n>=8 Vulkan cliff — that cliff is an MTP
  # property, not a backend threshold. DFlash2's acceptance is IDENTICAL at n=7/8/10 (52.1%)
  # because the drafter saturates its own block length, so it plateaus rather than collapsing.
  # Re-sweep if the drafter ever changes; never copy an n-max between drafters.
  #
  # The old qwen3.8-27b-mtp entry is kept on CT 123 as a one-line rollback.
  default: qwen3.8-27b-dflash2
  provider: custom
  base_url: http://gpu2:8080/v1
  api_key: ''
  context_length: 65536
timezone: America/New_York
onboarding:
  seen:
    tool_progress_prompt: true
# Trimmed toolset: coding = edit files (file) + run checks/commit on CT 122 (terminal) + complete (kanban) +
# skills + todo. Dropped browser/computer_use/image_gen/vision/tts/web/delegation/etc. so the coder can't
# wander off-script and stall (the ~1.1h hang on the fat couponType slice, 2026-07-18).
platform_toolsets:
  cli:
    - terminal
    - kanban
    - skills
    - file
    - todo
# False-completion guard: when the coder marks a task done, re-block it if its branch has ZERO commits
# ahead of main (i.e. verify-and-commit never committed — the coder claimed done without a real commit).
# The commit guard (pre-commit hook) stops BYPASS; this stops "claim done with no commit at all".
hooks_auto_accept: true
hooks:
  kanban_task_completed:
    - command: "/usr/local/bin/coder-commit-audit"
      timeout: 15
