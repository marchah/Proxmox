model:
  # qwen3.8-27b-mtp — the SAME Qwen3.8-27B weights as the old qwen3.8-27b-dflash entry;
  # only the speculative drafter differs. That entry borrowed Qwen3.6-27B's DFlash head
  # because Qwen ships no DFlash drafter for 3.8, and the borrow transfers only partly.
  # Qwen3.8 has its own native MTP head, so it now drafts for itself. Measured on CT 123
  # 2026-08-15, all at ctx 65536: no speculation 17.55 tok/s, borrowed DFlash 23.68
  # (28.8% acceptance), own MTP 27.73 (61.7%). Same window, same output quality — the
  # target weights are identical and speculation is verified against them.
  default: qwen3.8-27b-mtp
  provider: custom
  base_url: http://gpu2:8080/v1
  api_key: ''
  context_length: 65536
timezone: America/New_York
onboarding:
  seen:
    tool_progress_prompt: true
# Trimmed toolset: coding = edit files (file) + run checks/commit on CT 122 (terminal) + complete (kanban) +
# skills + todo. Dropped browser/computer_use/image_gen/vision/tts/web/delegation/etc. so the coder can't
# wander off-script and stall (the ~1.1h hang on the fat couponType slice, 2026-07-18).
platform_toolsets:
  cli:
    - terminal
    - kanban
    - skills
    - file
    - todo
# False-completion guard: when the coder marks a task done, re-block it if its branch has ZERO commits
# ahead of main (i.e. verify-and-commit never committed — the coder claimed done without a real commit).
# The commit guard (pre-commit hook) stops BYPASS; this stops "claim done with no commit at all".
hooks_auto_accept: true
hooks:
  kanban_task_completed:
    - command: "/usr/local/bin/coder-commit-audit"
      timeout: 15
