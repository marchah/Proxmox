# MealDeal — grocery-deal tracker (SPA + GraphQL + in-process ingest cron, one container).
#
# Deployed as a Portainer GIT STACK from this repo, so the file on disk here is the source of
# truth and "update the app" is a Portainer redeploy (or a webhook/poll):
#   Portainer -> Stacks -> Add stack -> Repository
#     Repository URL:  https://github.com/marchah/Proxmox
#     Reference:       refs/heads/main
#     Compose path:    docker-host/stacks/mealdeal/compose.yaml
#
# SECRETS DO NOT LIVE HERE. IMAP_USER/IMAP_PASSWORD are supplied as Portainer stack
# environment variables (Portainer stores them; this repo is public). Everything below either
# has a safe default or resolves to empty, and an empty IMAP_USER/IMAP_PASSWORD makes the app
# disable ingest entirely rather than crash — so the stack comes up clean before you add them.
#
# ── IMAGE SOURCE ─────────────────────────────────────────────────────────────────────────────
# PULLS a prebuilt image published by marchah/mealdeal's `Publish image` workflow (GHCR, public
# package — anonymous pull works, no registry credentials needed here). Nothing is built on the
# Docker host, so a redeploy is a ~10 s pull instead of a multi-minute rebuild.
#
# `main` is the moving tag that follows the app's default branch. `pull_policy: always` means a
# Portainer redeploy (or a git-stack auto-update) actually fetches it rather than reusing a stale
# local layer cache.
#
# TO ROLL BACK: pin the immutable tag of a known-good build and redeploy —
#   image: ghcr.io/marchah/mealdeal:sha-b63ad81
# Available tags: `main`, `sha-<short>` per commit, plus semver from `v*` releases.
# ─────────────────────────────────────────────────────────────────────────────────────────────

services:
  mealdeal:
    image: ghcr.io/marchah/mealdeal:main
    pull_policy: always
    container_name: mealdeal
    restart: unless-stopped
    # Query dnsmasq directly. On a compose (user-defined) network Docker hands the container its
    # embedded resolver at 127.0.0.11, whose upstream is the VM's systemd-resolved stub — and that
    # refuses single-label names, so `gpu2` and `llamacpp` never resolve. Verified: the same
    # container resolves them with this set and times out without it.
    dns:
      - 10.10.10.1
    ports:
      - '${MEALDEAL_PORT:-4000}:4000'
    volumes:
      # The ONLY precious state: the SQLite database. Back this volume up.
      - mealdeal-data:/data
    environment:
      DATABASE_URL: file:/data/mealdeal.db

      # Extraction runs on CT 123 (llama-swap, GPU 2). It used to target qwen3-instruct-2507,
      # chosen because CT 120's qwen3.6 reasoned unprompted, spent its whole budget inside
      # <think>, and returned finish_reason=length with no answer — every extraction hit the
      # client's 10-minute timeout.
      # ⚠️ CHANGED 2026-08-14: qwen3-instruct-2507 was RETIRED and its GGUF deleted, so this
      # default pointed at a model that no longer exists. Now qwen3.6-35b-a3b — the fastest
      # model on CT 123 (63.1 tok/s, 3B active). The original <think> failure no longer
      # applies: every CT 123 entry now runs --reasoning-format auto, so reasoning lands in
      # reasoning_content and `content` comes back clean. It DOES still spend tokens
      # reasoning, so watch extraction latency; if that bites, the cheapest fix is adding a
      # non-thinking model back to CT 123 rather than reverting this.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://gpu2:8080/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-needed}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen3.6-35b-a3b}

      # Mailbox to ingest. Set IMAP_USER + IMAP_PASSWORD (a Gmail APP password) as Portainer
      # stack env vars, then set INGEST_INLINE=1 and redeploy. Leaving them empty is safe.
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}

      # "0" is the only value that disables the in-process ingest scheduler.
      INGEST_INLINE: ${INGEST_INLINE:-0}
      INGEST_CRON: ${INGEST_CRON:-*/30 * * * *}
      INGEST_BATCH: ${INGEST_BATCH:-25}
      INGEST_SOURCE: ${INGEST_SOURCE:-imap}
      # Bearer token guarding the manual trigger POST /internal/ingest.
      INGEST_TOKEN: ${INGEST_TOKEN:-}

      # Merchant address geocoding. The public Nominatim default is capped at ~4 req/min and
      # receives any address the newsletters state — point it at a self-hosted geocoder to keep
      # addresses internal.
      GEOCODER_BASE_URL: ${GEOCODER_BASE_URL:-https://nominatim.openstreetmap.org}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-MealDeal/0.1 (+https://github.com/marchah/mealdeal)}

      # Optional five-digit US ZIP for near-me features.
      USER_LOCATION: ${USER_LOCATION:-}
    # The app exposes no /health route, so probe GraphQL: a `{__typename}` reply proves the HTTP
    # server is up, the schema built, and the startup migrations ran.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:4000/graphql',{method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({query:'{__typename}'})})
          .then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  mealdeal-data:
