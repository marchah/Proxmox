# work-board — a Linear + GitHub "what's next" board (one container, no state).
#
# Deployed as a Portainer GIT STACK from this repo, so the file on disk here is the source of
# truth and "update the app" is a Portainer redeploy (or a webhook/poll):
#   Portainer -> Stacks -> Add stack -> Repository
#     Repository URL:  https://github.com/marchah/Proxmox
#     Reference:       refs/heads/main
#     Compose path:    docker-host/stacks/work-board/compose.yaml
#
# SECRETS DO NOT LIVE HERE, and neither does the board's structure. Every value below defaults
# to empty and is supplied as a Portainer stack environment variable; what the board watches
# lives in app/config.toml inside the private work-board repo. That split is deliberate and
# load-bearing: it is what lets this compose file sit in a PUBLIC repo. An unconfigured source
# does not crash the stack — the board renders and says which variable is missing, by name.
#
# ── IMAGE SOURCE ─────────────────────────────────────────────────────────────────────────────
# PULLS a prebuilt image published by marchah/work-board's `Publish image` workflow. Nothing is
# built on the Docker host, so a redeploy is a ~5 s pull.
#
# ⚠️ UNLIKE MEALDEAL, THAT PACKAGE IS PRIVATE — marchah/work-board is a private repo, so its
# GHCR package is private too and anonymous pull does NOT work. Portainer needs a registry
# credential configured once, or the stack fails with `denied`/`unauthorized`, which reads like
# a missing image rather than a missing credential:
#   Portainer -> Registries -> Add registry -> Custom registry
#     Name: ghcr   URL: ghcr.io   Username: <github user>   Password: a PAT with read:packages
#
# `main` is the moving tag that follows the app's default branch. `pull_policy: always` means a
# redeploy actually fetches it rather than reusing a stale local layer cache.
#
# TO ROLL BACK: pin the immutable tag of a known-good build and redeploy —
#   image: ghcr.io/marchah/work-board:sha-b63ad81
# ─────────────────────────────────────────────────────────────────────────────────────────────

services:
  work-board:
    image: ghcr.io/marchah/work-board:main
    pull_policy: always
    container_name: work-board
    restart: unless-stopped
    # NOTE: no `dns: [10.10.10.1]` here, unlike the mealdeal stack. That override exists because
    # mealdeal resolves single-label homelab names (`gpu2`, `llamacpp`) which Docker's embedded
    # resolver refuses. This app only ever talks to api.linear.app and api.github.com, so the
    # default resolver is correct and adding the override would be cargo-culting.
    ports:
      - '${WORK_BOARD_PORT:-4100}:8088'
    # No volumes: the snapshot is held in memory and rebuilt on the next tick, so there is
    # nothing here worth backing up. A restart costs one collection cycle.
    environment:
      # ── Secrets ──────────────────────────────────────────────────────────────────────────
      # WHAT the board watches — lanes, labels, order, repos, which Linear workspace belongs
      # where — is NOT here. It lives in app/config.toml inside the private work-board repo,
      # baked into the image. Only secrets and runtime knobs are passed in, which is exactly
      # what lets this file sit in a public repo.
      #
      # One variable per Linear workspace. The NAMES are chosen by `linear_key_env` in
      # config.toml, so adding a workspace means editing there and adding the variable here.
      # ⚠️ The key defines who "me" is — the query filters on assignee.isMe, which resolves
      # against the key's own user. A bot's key yields an empty, correct board.
      LINEAR_API_KEY_WORK: ${LINEAR_API_KEY_WORK:-}
      LINEAR_API_KEY_PERSONAL: ${LINEAR_API_KEY_PERSONAL:-}

      # ⚠️ Needs read access to every repo in config.toml. A fine-grained PAT takes a SINGLE
      # resource owner, so spanning several organisations means either one token per org or a
      # classic PAT with `repo`.
      WORK_GITHUB_TOKEN: ${WORK_GITHUB_TOKEN:-}

      # ── Runtime ──────────────────────────────────────────────────────────────────────────
      # Overrides [github].login from config.toml when set. Normally leave empty.
      WORK_GITHUB_LOGIN: ${WORK_GITHUB_LOGIN:-}

      # Path to the config file. Point this at a bind-mounted path to change what the board
      # watches without rebuilding the image; empty uses the bundled app/config.toml.
      WORK_CONFIG: ${WORK_CONFIG:-}

      WORK_REFRESH_SECONDS: ${WORK_REFRESH_SECONDS:-300}
      # A lane not refreshed within this many seconds renders with a loud stale banner. Keep it
      # comfortably above WORK_REFRESH_SECONDS so one missed tick is not an alarm.
      WORK_STALE_SECONDS: ${WORK_STALE_SECONDS:-900}
      WORK_HTTP_TIMEOUT: ${WORK_HTTP_TIMEOUT:-15}
      WORK_LOG_LEVEL: ${WORK_LOG_LEVEL:-INFO}
    # /healthz answers 200 once the first collection has completed. It deliberately does NOT
    # check whether the sources succeeded — a board correctly reporting that Linear is down is a
    # working board, and failing the healthcheck on that would restart-loop the container for an
    # outage it is supposed to be displaying.
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
